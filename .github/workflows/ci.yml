name: Package CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / Illuminate ${{ matrix.illuminate }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.2'
            illuminate: '6.20.*'
          - php: '8.4'
            illuminate: '13.32.*'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest
        run: composer validate --strict

      # Laravel 6 resolves to EOL dependencies with published advisories. Relax only
      # advisory blocking for this ephemeral compatibility lane; malware blocking remains on.
      - name: Install legacy compatibility dependencies
        if: matrix.php == '7.2'
        run: composer update --with "illuminate/support:${{ matrix.illuminate }}" --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: '0'

      - name: Install current framework dependencies
        if: matrix.php == '8.4'
        run: composer update --with "illuminate/support:${{ matrix.illuminate }}" --prefer-dist --no-interaction --no-progress

      # Keep the framework components on one patch line. Pinning only support
      # to 13.0 while Composer resolves mail at 13.32 can produce an invalid
      # mixed Illuminate tree and a fatal Mailable trait load during PHPUnit.
      - name: Verify current Illuminate patch alignment
        if: matrix.php == '8.4'
        run: |
          package_version() {
            php -d display_errors=0 -r '$lock = json_decode(file_get_contents("composer.lock"), true); foreach (array_merge($lock["packages"] ?? [], $lock["packages-dev"] ?? []) as $package) { if (($package["name"] ?? "") === $argv[1]) { echo $package["version"] ?? ""; exit; } } fwrite(STDERR, "Package not found: ".$argv[1].PHP_EOL); exit(1);' "$1"
          }
          support_version="$(package_version illuminate/support)"
          mail_version="$(package_version illuminate/mail)"
          support_version="${support_version#v}"
          mail_version="${mail_version#v}"
          case "$support_version" in 13.32.*) ;; *) echo "Unexpected illuminate/support version: $support_version"; exit 1 ;; esac
          case "$mail_version" in 13.32.*) ;; *) echo "Unexpected illuminate/mail version: $mail_version"; exit 1 ;; esac

      - name: Lint PHP files
        run: |
          set -e
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find src tests -type f -name '*.php' -print0)

      - name: Run package tests
        run: composer test

      - name: Run static analysis
        run: composer analyse

      - name: Audit locked production dependencies
        if: matrix.php == '8.4'
        run: composer audit --locked --no-dev

      - name: Install CycloneDX Composer plugin
        if: matrix.php == '8.4'
        run: |
          composer global config --no-plugins allow-plugins.cyclonedx/cyclonedx-php-composer true
          composer global require --no-interaction --no-progress cyclonedx/cyclonedx-php-composer:6.2.0

      - name: Generate CycloneDX SBOM
        if: matrix.php == '8.4'
        run: composer CycloneDX:make-sbom --output-format=JSON --output-file=sbom.json --omit=dev --validate

      - name: Upload SBOM artifact
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: laravel-error-alert-sbom
          path: sbom.json
          if-no-files-found: error
